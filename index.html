<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06102e">
<meta name="description" content="拿著手機跳起來，帶小人環島台灣。跳得愈高，走得愈快。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="跳跳環島">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>跳跳環島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#06102e; --ink:#0a1638; --mint:#4dffb0; --ice:#38d9e8; --violet:#a46bff;
  --sun:#ffc933; --coral:#ff5a5f; --text:#f2fff8; --muted:#b6cfd8;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--text);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hide{display:none!important}

/* In-game readouts */
#top,#bottom{position:fixed;left:0;right:0;z-index:2;padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));transition:opacity .3s;pointer-events:none}
#top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:flex-start;justify-content:space-between}
#bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end}
.off{opacity:0}
#scoreV{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--sun);text-shadow:0 2px 0 var(--ink)}
#next{font-size:15px;margin-top:6px;color:var(--text);text-shadow:0 1px 3px var(--ink)}
.icons{display:flex;gap:8px;pointer-events:auto}
.icon{width:44px;height:44px;border-radius:50%;background:#0a163899;display:grid;place-items:center}
.icon svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.read b{display:block;font-weight:400;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--ink)}
.read span{font-size:13px;color:var(--muted);text-shadow:0 1px 3px var(--ink)}
.read.r{text-align:right}
#tier{display:block;text-align:center;font-size:17px;margin-bottom:6px;text-shadow:0 1px 3px var(--ink)}
.bar{display:block;height:14px;border-radius:7px;background:#0a1638b3;box-shadow:inset 0 0 0 2px #ffffff30;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);border-radius:7px;
  background:linear-gradient(90deg,var(--ice),var(--mint) 55%,var(--sun))}

/* Arrival note */
#toast{position:fixed;z-index:3;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translate(-50%,-12px);
  max-width:min(88vw,380px);width:max-content;padding:9px 16px;border-radius:20px 20px 20px 6px;background:var(--text);color:var(--ink);
  font-size:16px;line-height:1.4;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Screens */
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 24px calc(env(safe-area-inset-bottom,0px) + 22px)}
#start{justify-content:space-between;
  background:linear-gradient(180deg,#06102e00 42%,#06102edd 62%,#06102e)}
#start h1{margin:0;font-weight:400;font-size:clamp(50px,15.5vw,76px);line-height:1;letter-spacing:.04em;
  color:var(--text);text-shadow:0 3px 0 var(--ink),0 0 26px #4dffb080}
.lead{margin:0 0 6px;font-size:18px;line-height:1.55;max-width:32em;text-wrap:pretty}
.safe{margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--muted);max-width:32em}
.go{display:block;width:100%;max-width:420px;min-height:60px;padding:12px 20px;font-size:23px;border-radius:30px;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #b98400;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #b98400}
.alt{display:block;min-height:46px;padding:10px 4px;margin-top:8px;font-size:16px;color:var(--text);text-decoration:underline;text-underline-offset:4px}
.foot{align-self:stretch}

#count{justify-content:center;align-items:center;pointer-events:none;background:none}
#countV{font-size:120px;line-height:1;color:var(--text);text-shadow:0 4px 0 var(--ink),0 0 30px var(--mint)}
#countH{font-size:18px;margin-top:10px;text-shadow:0 1px 4px var(--ink)}

#pause{justify-content:center;align-items:center;gap:6px;background:#06102ee0;text-align:center}
#pause h2{font-weight:400;font-size:34px;margin:0 0 16px}
#pause .alt{margin-top:6px}

#result{justify-content:flex-end;background:none;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:440px;margin:0 auto;max-height:100%;overflow:auto;touch-action:pan-y;
  padding:18px 22px 20px;border-radius:28px;background:#0a1638ec;box-shadow:inset 0 0 0 2px #4dffb066;
  animation:rise .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.sheet h2{font-weight:400;margin:0;font-size:26px;text-align:center}
#finalV{font-size:60px;line-height:1.1;text-align:center;color:var(--sun);font-variant-numeric:tabular-nums}
#rank{text-align:center;font-size:16px;color:var(--mint);margin-bottom:10px}
dl{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin:0 0 12px;font-size:16px}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#again{text-align:center;font-size:19px;margin:0 0 10px}
.sheet .go{margin:0 auto}
.sheet .alt{margin:6px auto 0}
@media (max-height:640px){
  #finalV{font-size:44px} dl{font-size:15px;gap:2px 14px} .sheet{padding:12px 18px 14px}
  .lead{font-size:16px} .safe{font-size:14px;margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="極光下的台灣地圖，小人沿著路線環島"></canvas>

<div id="top" class="off">
  <div>
    <div id="scoreV">0</div>
    <div id="next"></div>
  </div>
  <div class="icons">
    <button class="icon" id="soundB" aria-label="關閉聲音" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path id="wave" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
    <button class="icon" id="pauseB" aria-label="暫停">
      <svg viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14"/></svg>
    </button>
  </div>
</div>

<div id="bottom" class="off">
  <div class="read"><b id="lastV">0</b><span>公分，上一跳</span></div>
  <div><span id="tier">慢慢走</span><span class="bar"><i id="barV"></i></span></div>
  <div class="read r"><b id="comboV">×1.0</b><span>連跳加成</span></div>
</div>

<div id="toast" role="status"></div>

<section class="screen" id="start">
  <h1>跳跳環島</h1>
  <div class="foot">
    <p class="lead">拿著手機跳起來，帶小人從台南走到台北，再沿東海岸走回台南。跳得愈高，走得愈快。</p>
    <p class="safe">雙手握緊手機，在空曠平坦的地方跳。</p>
    <button class="go" id="goMotion">開始跳</button>
    <button class="alt" id="goTouch">不能跳？改用手指玩</button>
    <button class="alt hide" id="installB">安裝到手機</button>
    <p class="safe hide" id="iosTip">想裝到手機：在 Safari 點分享，再選「加入主畫面」。</p>
  </div>
</section>

<section class="screen hide" id="count">
  <div id="countV">3</div>
  <div id="countH">準備起跳</div>
</section>

<section class="screen hide" id="pause">
  <h2>休息一下</h2>
  <button class="go" id="resumeB">繼續環島</button>
  <button class="alt" id="switchB">改用手指玩</button>
  <button class="alt" id="quitB">結束這一局</button>
</section>

<section class="screen hide" id="result">
  <div class="sheet">
    <h2>環島成功！</h2>
    <div id="finalV">0</div>
    <div id="rank"></div>
    <dl>
      <dt>跳躍次數</dt><dd id="rJumps"></dd>
      <dt>最高一跳</dt><dd id="rMax"></dd>
      <dt>平均跳高</dt><dd id="rAvg"></dd>
      <dt>最長連跳</dt><dd id="rCombo"></dd>
      <dt>環島時間</dt><dd id="rTime"></dd>
      <dt>時間加分</dt><dd id="rBonus"></dd>
      <dt id="rBestL">最佳紀錄</dt><dd id="rBest"></dd>
    </dl>
    <p id="again">要再玩一次嗎？</p>
    <button class="go" id="againB">再玩一次</button>
    <button class="alt" id="noB">先不用，回到開始畫面</button>
  </div>
</section>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

/* ---------- Geography ---------- */
const COS=Math.cos(23.7*Math.PI/180);
const LON0=119.98, LON1=122.06, LAT0=21.84, LAT1=25.36;
const OUTLINE=[[121.54,25.30],[121.75,25.14],[122.00,25.01],[121.87,24.84],[121.87,24.59],[121.62,23.98],[121.52,23.60],
[121.38,23.10],[121.15,22.76],[120.90,22.35],[120.85,21.90],[120.70,21.93],[120.71,22.07],[120.65,22.24],[120.59,22.37],
[120.45,22.46],[120.27,22.60],[120.17,22.90],[120.15,23.00],[120.05,23.12],[120.15,23.38],[120.14,23.58],[120.19,23.79],
[120.30,23.93],[120.42,24.06],[120.50,24.27],[120.55,24.38],[120.67,24.50],[120.82,24.70],[120.91,24.82],[120.97,24.95],
[121.10,25.06],[121.30,25.12],[121.41,25.18],[121.50,25.29]];
/* Route: a stop has a name; bare points only keep the path on land. */
const WAY=[
 {n:'台南',p:[120.22,23.00],s:'r'},
 {p:[120.32,23.30]},
 {n:'嘉義',p:[120.45,23.48],s:'r',food:'火雞肉飯'},
 {p:[120.53,23.75]},
 {n:'彰化',p:[120.54,24.06],s:'l2',food:'肉圓'},
 {n:'台中',p:[120.68,24.16],s:'r',food:'太陽餅'},
 {p:[120.82,24.54]},
 {n:'新竹',p:[120.98,24.80],s:'r',food:'貢丸湯'},
 {n:'桃園',p:[121.30,24.98],s:'b',food:'大溪豆干'},
 {n:'台北',p:[121.52,25.05],s:'b',half:true},
 {p:[121.72,24.96]},
 {n:'宜蘭',p:[121.74,24.75],s:'l',food:'蔥油餅'},
 {p:[121.78,24.56]},
 {p:[121.66,24.25]},
 {n:'花蓮',p:[121.56,23.98],s:'l',food:'麻糬'},
 {p:[121.42,23.50]},
 {p:[121.27,23.10]},
 {n:'台東',p:[121.08,22.78],s:'l',food:'釋迦'},
 {p:[120.86,22.38]},
 {n:'恆春',p:[120.76,22.03],s:'r',food:'洋蔥'},
 {p:[120.72,22.30]},
 {p:[120.52,22.56]},
 {n:'高雄',p:[120.33,22.65],s:'r',food:'木瓜牛奶'},
 {p:[120.24,22.84]},
 {n:'台南',p:[120.22,23.00],s:null,end:true}
];
const ROUTE=[],CUM=[0],STOPS=[];
(function buildRoute(){
  const P=WAY.map(w=>w.p);const at=i=>P[clamp(i,0,P.length-1)];
  const STEPS=18;
  for(let i=0;i<P.length-1;i++){
    if(WAY[i].n)STOPS.push({...WAY[i],idx:ROUTE.length});
    const a=at(i-1),b=at(i),c=at(i+1),d=at(i+2);
    for(let k=0;k<STEPS;k++){
      const t=k/STEPS,t2=t*t,t3=t2*t;
      const f=j=>.5*(2*b[j]+(c[j]-a[j])*t+(2*a[j]-5*b[j]+4*c[j]-d[j])*t2+(3*b[j]-a[j]-3*c[j]+d[j])*t3);
      ROUTE.push([f(0),f(1)]);
    }
  }
  STOPS.push({...WAY[WAY.length-1],idx:ROUTE.length});
  ROUTE.push(P[P.length-1]);
  for(let i=1;i<ROUTE.length;i++){
    const dx=(ROUTE[i][0]-ROUTE[i-1][0])*111*COS,dy=(ROUTE[i][1]-ROUTE[i-1][1])*111;
    CUM.push(CUM[i-1]+Math.hypot(dx,dy));
  }
})();
const TOTAL_KM=CUM[CUM.length-1];
STOPS.forEach(s=>s.km=CUM[s.idx]);
function pointAt(km){
  let lo=0,hi=CUM.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(CUM[m]<=km)lo=m;else hi=m}
  const seg=CUM[hi]-CUM[lo]||1,t=clamp((km-CUM[lo])/seg,0,1),a=ROUTE[lo],b=ROUTE[hi];
  return {lon:a[0]+(b[0]-a[0])*t,lat:a[1]+(b[1]-a[1])*t,dir:b[0]-a[0]};
}

/* ---------- Canvas & layout ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,K=180,OX=0,OY=0;
const bgC=document.createElement('canvas'),mapC=document.createElement('canvas'),auC=document.createElement('canvas');
const auX=auC.getContext('2d');
let routePath=null,routeLen=0;
const px=(lon,lat)=>[OX+(lon-LON0)*K*COS,OY+(LAT1-lat)*K];

function layout(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;
  const topH=$('top').getBoundingClientRect().bottom+4;
  const botH=H-$('bottom').getBoundingClientRect().top+4;
  const availH=Math.max(200,H-topH-botH),availW=W-20;
  K=Math.min(availH/(LAT1-LAT0),availW/((LON1-LON0)*COS));
  OX=(W-(LON1-LON0)*K*COS)/2;
  OY=topH+(availH-(LAT1-LAT0)*K)/2;
  drawBg();drawMap();buildAurora();
}

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}

function drawBg(){
  bgC.width=W*DPR;bgC.height=H*DPR;const c=bgC.getContext('2d');c.scale(DPR,DPR);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#040a22');g.addColorStop(.55,'#071639');g.addColorStop(1,'#0a2a4a');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const r=rng(4242),n=Math.round(W*H/5200);
  for(let i=0;i<n;i++){
    c.globalAlpha=.25+r()*.7;c.fillStyle=r()>.85?'#bfe9ff':'#fff';
    const s=r()*1.5+.4;c.beginPath();c.arc(r()*W,r()*H,s,0,7);c.fill();
  }
  c.globalAlpha=1;
}

function islandPath(c){
  c.beginPath();
  const n=OUTLINE.length;
  const mid=i=>{const a=px(...OUTLINE[i%n]),b=px(...OUTLINE[(i+1)%n]);return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
  const s=mid(n-1);c.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const p=px(...OUTLINE[i]),m=mid(i);c.quadraticCurveTo(p[0],p[1],m[0],m[1])}
  c.closePath();
}

function drawMap(){
  mapC.width=W*DPR;mapC.height=H*DPR;const c=mapC.getContext('2d');c.scale(DPR,DPR);
  /* glow around the coast, lit by the aurora */
  c.save();c.shadowColor='#4dffb0';c.shadowBlur=26;islandPath(c);c.fillStyle='#14503f';c.fill();c.restore();
  const top=px(121.5,25.3),bot=px(120.85,21.9);
  const g=c.createLinearGradient(0,top[1],0,bot[1]);
  g.addColorStop(0,'#1f7a5c');g.addColorStop(.5,'#186a5a');g.addColorStop(1,'#14565f');
  islandPath(c);c.fillStyle=g;c.fill();
  c.lineWidth=2.5;c.strokeStyle='#8dffd0';islandPath(c);c.stroke();

  /* central mountains */
  c.save();islandPath(c);c.clip();
  const spine=[[121.42,24.72],[121.22,24.30],[121.06,23.85],[120.97,23.45],[120.90,22.95],[120.82,22.40]];
  const r=rng(77),peaks=[];
  for(let i=0;i<34;i++){
    const u=i/33*(spine.length-1),j=Math.min(Math.floor(u),spine.length-2),t=u-j;
    const lon=spine[j][0]+(spine[j+1][0]-spine[j][0])*t+(r()-.5)*.17;
    const lat=spine[j][1]+(spine[j+1][1]-spine[j][1])*t+(r()-.5)*.12;
    const mid=1-Math.abs(i/33-.5)*1.4;
    peaks.push({lon,lat,s:(.08+.09*mid+r()*.03)*K});
  }
  peaks.sort((a,b)=>b.lat-a.lat);
  for(const m of peaks){
    const[x,y]=px(m.lon,m.lat),s=m.s;
    c.fillStyle='#0f4a4c';c.beginPath();c.moveTo(x-s*.7,y);c.lineTo(x,y-s);c.lineTo(x+s*.7,y);c.closePath();c.fill();
    c.fillStyle='#2c8f79';c.beginPath();c.moveTo(x-s*.7,y);c.lineTo(x,y-s);c.lineTo(x-s*.05,y);c.closePath();c.fill();
    c.fillStyle='#e6fff5';c.beginPath();c.moveTo(x-s*.2,y-s*.71);c.lineTo(x,y-s);c.lineTo(x+s*.2,y-s*.71);c.closePath();c.fill();
  }
  c.restore();

  /* route */
  routePath=new Path2D();routeLen=0;
  ROUTE.forEach((p,i)=>{const q=px(p[0],p[1]);
    if(i){const r0=px(...ROUTE[i-1]);routeLen+=Math.hypot(q[0]-r0[0],q[1]-r0[1]);routePath.lineTo(q[0],q[1])}
    else routePath.moveTo(q[0],q[1])});
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle='#06102e99';c.lineWidth=6;c.stroke(routePath);
  c.strokeStyle='#ffffffc4';c.lineWidth=2.4;c.setLineDash([.1,7]);c.stroke(routePath);c.setLineDash([]);

  /* stop names */
  const fs=clamp(K*.075,11,15);
  c.font=fs+'px '+FONT;c.textBaseline='middle';
  STOPS.forEach(s=>{
    if(!s.s)return;
    const[x,y]=px(s.p[0],s.p[1]);let tx=x,ty=y,al='left';
    if(s.s==='r'){tx=x+9}
    else if(s.s==='l'){tx=x-9;al='right'}
    else if(s.s==='l2'){tx=x-9;al='right'}
    else if(s.s==='b'){ty=y+fs+1;al='center'}
    c.textAlign=al;c.lineWidth=3.5;c.strokeStyle='#06102ecc';c.lineJoin='round';
    c.strokeText(s.n,tx,ty);c.fillStyle='#fff';c.fillText(s.n,tx,ty);
  });
}

/* Aurora: curtain columns on a small canvas, enlarged so they soften */
let sprites=[],auW=0,auH=0;
function sprite(stops){
  const s=document.createElement('canvas');s.width=2;s.height=256;
  const c=s.getContext('2d'),g=c.createLinearGradient(0,0,0,256);
  stops.forEach(([o,col])=>g.addColorStop(o,col));c.fillStyle=g;c.fillRect(0,0,2,256);return s;
}
function buildAurora(){
  auW=Math.max(50,Math.round(W/6));auH=Math.max(90,Math.round(H/6));auC.width=auW;auC.height=auH;
  if(sprites.length)return;
  sprites=[
    sprite([[0,'#a46bff00'],[.35,'#a46bff40'],[.68,'#38d9e870'],[.92,'#4dffb0f0'],[.97,'#b8ffe0ff'],[1,'#4dffb000']]),
    sprite([[0,'#ff5ea800'],[.4,'#c060ff48'],[.75,'#5a8cff66'],[.95,'#38d9e8e0'],[1,'#38d9e800']]),
    sprite([[0,'#38d9e800'],[.5,'#2bd8a048'],[.9,'#4dffb0c8'],[1,'#4dffb000']])
  ];
}
const BANDS=[
  {y:.34,h:.42,a:.075,ph:.3,s:0,sp:1},
  {y:.62,h:.46,a:.10,ph:2.1,s:1,sp:.8},
  {y:.92,h:.44,a:.08,ph:4.4,s:2,sp:1.15}
];
function drawAurora(t){
  auX.globalCompositeOperation='source-over';auX.clearRect(0,0,auW,auH);
  auX.globalCompositeOperation='lighter';
  const speed=reduce?.3:1;t*=speed;
  for(const b of BANDS){
    const tt=t*b.sp,sp=sprites[b.s],h=b.h*auH;
    for(let x=0;x<auW;x++){
      const u=x/auW*7;
      const y=b.y*auH+b.a*auH*(Math.sin(u*.9+tt*.23+b.ph)+.6*Math.sin(u*2.1-tt*.31+b.ph*2)+.3*Math.sin(u*5+tt*.6));
      let a=.52+.34*Math.sin(u*2.3+tt*.45+b.ph)+.14*Math.sin(u*5.3-tt*.8+b.ph)+.05*Math.sin(u*11+tt*1.3);
      a=clamp(a,0,1)*(.75+.25*Math.sin(tt*.17+b.ph));
      auX.globalAlpha=a;
      auX.drawImage(sp,x,y-h,1.2,h);
    }
  }
  auX.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(auC,0,0,W,H);
  ctx.globalCompositeOperation='source-over';
}

/* ---------- Character ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawKid(x,y,o){
  const c=ctx,S=clamp(K/185,.72,1.15)*1.08,hop=o.hop||0,ph=o.phase||0,cheer=o.cheer;
  c.save();c.translate(x,y);
  /* ground glow and shadow */
  const sh=clamp(1-hop/90,.45,1);
  c.fillStyle='#ffc93355';c.beginPath();c.ellipse(0,0,22*S*sh,10*S*sh,0,0,7);c.fill();
  c.fillStyle='#06102eb0';c.beginPath();c.ellipse(0,0,12*S*sh,5*S*sh,0,0,7);c.fill();
  c.translate(0,-hop);c.scale((o.face||1)*S,S);
  const sq=o.squash||0;c.scale(1+sq,1-sq);
  const out='#0a1638';c.lineCap='round';c.lineJoin='round';
  const swing=hop>2?.9:Math.sin(ph),bob=hop>2?0:Math.abs(Math.cos(ph))*1.6;
  c.translate(0,-bob);
  /* legs */
  const leg=(side,sw)=>{
    c.strokeStyle=out;c.lineWidth=7.5;c.beginPath();c.moveTo(side,-13);c.lineTo(side+sw*6,-3);c.stroke();
    c.strokeStyle='#27408f';c.lineWidth=4.5;c.beginPath();c.moveTo(side,-13);c.lineTo(side+sw*6,-3);c.stroke();
    c.fillStyle='#fff';c.strokeStyle=out;c.lineWidth=2;c.beginPath();c.ellipse(side+sw*6+1.5,-1.5,4.6,3,0,0,7);c.fill();c.stroke();
  };
  leg(-3,-swing);
  /* backpack */
  c.fillStyle='#ff5a5f';c.strokeStyle=out;c.lineWidth=2;rr(c,-13.5,-29,9,15,4);c.fill();c.stroke();
  /* arm behind */
  const arm=(sw,up)=>{
    const ex=up?7:sw*8+1,ey=up?-41:-16;
    c.strokeStyle=out;c.lineWidth=6.5;c.beginPath();c.moveTo(0,-25);c.lineTo(ex,ey);c.stroke();
    c.strokeStyle='#ffd9b0';c.lineWidth=3.6;c.beginPath();c.moveTo(0,-25);c.lineTo(ex,ey);c.stroke();
  };
  arm(swing,cheer||hop>6);
  leg(3,swing);
  /* body */
  c.fillStyle='#38d9e8';c.strokeStyle=out;c.lineWidth=2;rr(c,-7.5,-29,15,18,6);c.fill();c.stroke();
  c.strokeStyle='#ff5a5f';c.lineWidth=2.4;c.beginPath();c.moveTo(-5,-28);c.lineTo(-5,-17);c.stroke();
  /* head */
  c.fillStyle='#ffd9b0';c.strokeStyle=out;c.lineWidth=2;c.beginPath();c.arc(0,-37,10.5,0,7);c.fill();c.stroke();
  /* cap */
  c.fillStyle='#ffc933';c.beginPath();c.arc(0,-38.5,10.5,Math.PI*1.02,Math.PI*1.98);c.closePath();c.fill();c.stroke();
  c.beginPath();c.ellipse(9,-39,7,2.4,.05,0,7);c.fill();c.stroke();
  /* face */
  c.fillStyle=out;c.beginPath();c.arc(3,-35,1.5,0,7);c.arc(8,-35,1.4,0,7);c.fill();
  c.fillStyle='#ff8d8d';c.beginPath();c.arc(.5,-31.5,1.9,0,7);c.fill();
  c.strokeStyle=out;c.lineWidth=1.5;c.beginPath();
  if(hop>4||cheer)c.arc(5,-32,2.6,.1,Math.PI-.1);else c.arc(5,-32.5,2,.3,Math.PI-.3);
  c.stroke();
  /* front arm */
  arm(-swing,cheer||hop>6);
  c.restore();
}

/* ---------- Audio ---------- */
let ac=null,master=null,sound=true,noise=null;
function initAudio(){
  try{
    if(!ac){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      ac=new A();master=ac.createGain();master.gain.value=sound?.75:0;master.connect(ac.destination);
      noise=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);
      const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null}
}
function tone(f,at,dur,type,vol,glide){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;
  o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.2,t+.012);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function boom(at){
  if(!ac)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+at;
  s.buffer=noise;f.type='lowpass';f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(120,t+.45);
  g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.55);
}
const sfxJump=h=>{const f=260+h*9;tone(f,0,.16,'square',.07,f*1.9)};
const sfxStop=()=>[659,880,1109].forEach((f,i)=>tone(f,i*.07,.2,'triangle',.16));
const N={G3:196,C4:261.63,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,C6:1046.5};
function fanfare(){
  const b=.17;let t=0;
  const lead=[['G4',1],['C5',1],['E5',1],['G5',3],['E5',1],['G5',4],
    ['A5',1],['G5',1],['F5',1],['E5',1],['D5',1],['E5',1],['C5',2],['D5',2],['G5',2],
    ['E5',1],['G5',1],['C6',2],['A5',1],['C6',1],['G5',2],['E5',1],['G5',1],['A5',2],['F5',1],['D5',1],['C5',1],['E5',1],['G5',2],['C6',6]];
  lead.forEach(([n,d])=>{tone(N[n],t,b*d*1.05+.1,'square',.09);tone(N[n]/2,t,b*d+.08,'triangle',.11);t+=b*d});
  const chords=[['C4','E4','G4'],['F4','A4','C5'],['G3','B4','D5'],['C4','E4','G4']];
  for(let i=0;i<Math.ceil(t/(b*8));i++){
    const ch=chords[i%4];
    [0,3,6].forEach(s=>ch.forEach(n=>tone(N[n],i*b*8+s*b,.14,'triangle',.05)));
  }
  [t-.02].forEach(a=>['C5','E5','G5','C6'].forEach((n,i)=>tone(N[n],a+i*.03,1.5,'triangle',.11)));
}

/* ---------- Jump detection ----------
   A jump looks like: push-off spike → free fall → landing spike.
   Time in free fall gives height: h = g·t²/8. */
const PUSH=13.5,LOW=5.0,LAND=13,MIN_AIR=170,MAX_AIR=1050,ARM_WINDOW=500,LOW_HOLD=30;
const det={st:'ground',lp:9.8,armAt:-1e9,lowAt:0,airAt:0,lastAt:-1e9,count:0};
function detect(m,t){
  det.lp+=(m-det.lp)*.6;const v=det.lp;
  if(det.st==='ground'){
    if(v>PUSH)det.armAt=t;
    if(v<LOW&&t-det.armAt<ARM_WINDOW){
      if(!det.lowAt)det.lowAt=t;
      if(t-det.lowAt>=LOW_HOLD){det.st='air';det.airAt=det.lowAt}
    }else det.lowAt=0;
  }else{
    const air=t-det.airAt;
    if(v>LAND){
      det.st='ground';det.lowAt=0;det.armAt=t;
      if(air>=MIN_AIR&&air<=MAX_AIR&&t-det.lastAt>220){
        det.lastAt=t;const s=air/1000;jump(9.81*s*s/8*100);
      }
    }else if(air>MAX_AIR){det.st='ground';det.lowAt=0}
  }
}
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null||a.y==null||a.z==null)return;
  det.count++;
  detect(Math.hypot(a.x,a.y,a.z),e.timeStamp||performance.now());
}
async function askMotion(){
  if(typeof DeviceMotionEvent==='undefined')return false;
  if(typeof DeviceMotionEvent.requestPermission==='function'){
    try{return await DeviceMotionEvent.requestPermission()==='granted'}catch(e){return false}
  }
  return true;
}

/* ---------- Fireworks ---------- */
const FW=['#4dffb0','#38d9e8','#a46bff','#ffc933','#ff5a5f','#ffffff','#ff8fd0'];
function launch(){
  rockets.push({x:W*(.14+Math.random()*.72),y:H+4,tx:H*(.1+Math.random()*.3),v:H*(.8+Math.random()*.25),c:FW[Math.floor(Math.random()*FW.length)]});
}
function burst(x,y,col){
  boom(0);const n=reduce?30:70,alt=FW[Math.floor(Math.random()*FW.length)];
  for(let i=0;i<n;i++){
    const a=i/n*6.283+Math.random()*.1,v=(70+Math.random()*120)*clamp(W/390,.9,1.5);
    shards.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,l:1+Math.random()*.7,c:i%3?col:alt});
  }
}
let nextRocket=0;
function stepFire(dt,now){
  if((state==='finish'||state==='result')&&now>nextRocket){launch();if(Math.random()<.4)launch();nextRocket=now+(reduce?1100:520)}
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];const oy=r.y;r.y-=r.v*dt;
    ctx.strokeStyle=r.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(r.x,oy+16);ctx.lineTo(r.x,r.y);ctx.stroke();
    if(r.y<=r.tx){burst(r.x,r.y,r.c);rockets.splice(i,1)}
  }
  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i];s.t+=dt;if(s.t>s.l){shards.splice(i,1);continue}
    s.px=s.x;s.py=s.y;s.vx*=1-1.5*dt;s.vy=s.vy*(1-1.5*dt)+70*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    ctx.globalAlpha=1-s.t/s.l;ctx.strokeStyle=s.c;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(s.px-(s.x-s.px)*1.6,s.py-(s.y-s.py)*1.6);ctx.lineTo(s.x,s.y);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ---------- Main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const T=now/1000;

  if(state==='play'){
    playMs+=dt*1000;
    const d=energy*(1-Math.exp(-dt/TAU));energy-=d;
    const moved=d+BASE_KM*dt;km+=moved;
    const sp=moved/Math.max(dt,.001),ratio=clamp(sp/(TOTAL_KM*.03),0,1);
    $('barV').style.transform='scaleX('+ratio.toFixed(3)+')';
    $('tier').textContent=ratio>.8?'全力衝刺':ratio>.45?'小跑步':ratio>.18?'快走':'慢慢走';
    phase+=(3+ratio*20)*dt;
    while(nextStop<STOPS.length&&km>=STOPS[nextStop].km){reachStop(STOPS[nextStop]);nextStop++}
    updateNext();
    idleHint+=dt;
    if(idleHint>6&&jumps>0){idleHint=0;toast('跳起來！小人快走不動了')}
    if(mode==='motion'&&!jumps&&playMs>12000&&!motionHint){motionHint=true;toast('還沒偵測到跳躍。握緊手機往上跳，跳到雙腳離地',3400)}
    if(performance.now()-lastJumpAt>COMBO_GAP&&combo){combo=0;$('comboV').textContent='×1.0'}
    if(km>=TOTAL_KM)finish();
  }
  if(state==='finish'||state==='result'){cheer=1;if(hop<=0&&hopV<=0)hopV=170;phase+=dt*4}
  if(state==='title'){phase+=dt*2}
  /* hop physics */
  if(hop>0||hopV>0){hop+=hopV*dt;hopV-=900*dt;if(hop<=0){hop=0;hopV=0;squash=.12}}
  squash=Math.max(0,squash-dt*.7);

  /* score count-up */
  scoreShown+=(score-scoreShown)*Math.min(1,dt*12);
  $('scoreV').textContent=Math.round(scoreShown).toLocaleString('en-US');

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bgC,0,0,W,H);
  drawAurora(T);
  ctx.drawImage(mapC,0,0,W,H);

  /* walked road */
  ctx.lineCap='round';ctx.lineJoin='round';
  const walked=km/TOTAL_KM*routeLen;
  if(walked>.5){
    ctx.setLineDash([walked,routeLen*2]);
    ctx.strokeStyle='#ffc93350';ctx.lineWidth=9;ctx.stroke(routePath);
    ctx.strokeStyle='#ffc933';ctx.lineWidth=4;ctx.stroke(routePath);
    ctx.setLineDash([]);
  }
  /* stop dots */
  for(let i=0;i<STOPS.length-1;i++){
    const s=STOPS[i],[x,y]=px(s.p[0],s.p[1]),done=km>=s.km;
    ctx.fillStyle=done?'#ffc933':'#fff';ctx.strokeStyle='#0a1638';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,i?4.5:6,0,7);ctx.fill();ctx.stroke();
  }

  /* character */
  const p=pointAt(km),q=px(p.lon,p.lat);
  if(Math.abs(p.dir)>1e-5)face=p.dir>0?1:-1;
  if(charging){
    const r=clamp(K/185,.72,1.15)*34,ch=chargeOf();
    ctx.strokeStyle='#ffffff40';ctx.lineWidth=6;ctx.beginPath();ctx.arc(q[0],q[1]-22,r,0,7);ctx.stroke();
    ctx.strokeStyle='#ffc933';ctx.beginPath();ctx.arc(q[0],q[1]-22,r,-1.57,-1.57+ch*6.283);ctx.stroke();
  }
  drawKid(q[0],q[1],{hop,phase,face,cheer:cheer>0,squash});

  /* sparks */
  ctx.globalCompositeOperation='lighter';
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.t+=dt;if(s.t>s.l){sparks.splice(i,1);continue}
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=120*dt;
    ctx.globalAlpha=1-s.t/s.l;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,2.4,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  /* score pop-ups */
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.t+=dt;if(f.t>1){floats.splice(i,1);continue}
    const y=f.y-f.t*44,a=f.t<.7?1:1-(f.t-.7)/.3,fs=f.big?26:20;
    ctx.globalAlpha=a;ctx.font=fs+'px '+FONT;ctx.lineWidth=4;ctx.strokeStyle='#0a1638';ctx.fillStyle='#ffc933';
    ctx.strokeText(f.text,f.x,y);ctx.fillText(f.text,f.x,y);
    if(f.sub){ctx.font='15px '+FONT;ctx.fillStyle='#fff';ctx.strokeText(f.sub,f.x,y-fs*.85);ctx.fillText(f.sub,f.x,y-fs*.85)}
  }
  ctx.globalAlpha=1;
  stepFire(dt,now);
}

/* ---------- Install as an app ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!standalone){$('iosTip').classList.remove('hide')}
let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('installB').classList.remove('hide')});
$('installB').addEventListener('click',async()=>{
  if(!installEvent)return;
  installEvent.prompt();
  try{await installEvent.userChoice}catch(e){}
  installEvent=null;$('installB').classList.add('hide');
});
window.addEventListener('appinstalled',()=>$('installB').classList.add('hide'));
if('serviceWorker' in navigator&&window.isSecureContext){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- Boot ---------- */
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,200));
updateNext();layout();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawMap);
requestAnimationFrame(frame);
})();
</script>
